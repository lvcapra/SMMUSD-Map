<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        #map {
            width: 1991px;
            height: 1192px;
        }
        </style>
        <title></title>
    </head>
    <body>
        <div id="map">
        </div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/L.Control.Layers.Tree.min.js"></script>
        <script src="js/multi-style-layer.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/Assets_1.js"></script>
        <script>
        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 0, 1.00)',
              });
            } else {
              highlightLayer.setStyle({
                fillColor: 'rgba(255, 255, 0, 1.00)',
                fillOpacity: 1
              });
            }
        }
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        }).fitBounds([[34.00443984033163,-118.47849788502523],[34.020506157540254,-118.45986481314357]]);
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
        }
        map.createPane('pane_LACounty_Aerial_0');
        map.getPane('pane_LACounty_Aerial_0').style.zIndex = 400;
        var layer_LACounty_Aerial_0 = L.tileLayer('https://cache.gis.lacounty.gov/cache/rest/services/LACounty_Cache/LACounty_Aerial_2014/MapServer/tile/{z}/{y}/{x}', {
            pane: 'pane_LACounty_Aerial_0',
            opacity: 1.0,
            attribution: '',
            minZoom: 1,
            maxZoom: 28,
            minNativeZoom: 0,
            maxNativeZoom: 20
        });
        layer_LACounty_Aerial_0;
        map.addLayer(layer_LACounty_Aerial_0);
        function pop_Assets_1(feature, layer) {
            layer.on({
                mouseout: function(e) {
                    for (var i in e.target._eventParents) {
                        if (typeof e.target._eventParents[i].resetStyle === 'function') {
                            e.target._eventParents[i].resetStyle(e.target);
                        }
                    }
                },
                mouseover: highlightFeature,
            });
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['site_name'] !== null ? autolinker.link(String(feature.properties['site_name']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['category'] !== null ? autolinker.link(String(feature.properties['category']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['notes'] !== null ? autolinker.link(String(feature.properties['notes']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <th scope="row">area_sqft</th>\
                        <td>' + (feature.properties['area_sqft'] !== null ? autolinker.link(String(feature.properties['area_sqft']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_Assets_1_0(feature) {
            switch(String(feature.properties['category'])) {
                case 'Functional':
                    return {
                pane: 'pane_Assets_1',
                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(163,205,185,1.0)',
                interactive: true,
            }
                    break;
                case 'Non-Functional':
                    return {
                pane: 'pane_Assets_1',
                stroke: false, 
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(205,204,115,1.0)',
                interactive: true,
            }
                    break;
            }
        }
        function style_Assets_1_1(feature) {
            switch(String(feature.properties['category'])) {
                case 'Functional':
                    return {
                pane: 'pane_Assets_1',
                interactive: true,
            }
                    break;
                case 'Non-Functional':
                    return {
                pane: 'pane_Assets_1',
                interactive: true,
            }
                    break;
            }
        }
        map.createPane('pane_Assets_1');
        map.getPane('pane_Assets_1').style.zIndex = 401;
        map.getPane('pane_Assets_1').style['mix-blend-mode'] = 'normal';
        var layer_Assets_1 = new L.geoJson.multiStyle(json_Assets_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_Assets_1',
            layerName: 'layer_Assets_1',
            pane: 'pane_Assets_1',
            onEachFeature: pop_Assets_1,
            styles: [style_Assets_1_0,style_Assets_1_1,]
        });
        bounds_group.addLayer(layer_Assets_1);
        map.addLayer(layer_Assets_1);
        var overlaysTree = [
            {label: 'Assets<br /><table><tr><td style="text-align: center;"><img src="legend/Assets_1_FunctionalTurf0.png" /></td><td>Functional Turf</td></tr><tr><td style="text-align: center;"><img src="legend/Assets_1_NonFunctionalTurf1.png" /></td><td>Non-Functional Turf</td></tr></table>', layer: layer_Assets_1},
            {label: "LACounty_Aerial", layer: layer_LACounty_Aerial_0},]
        var lay = L.control.layers.tree(null, overlaysTree,{
            //namedToggle: true,
            //selectorBack: false,
            //closedSymbol: '&#8862; &#x1f5c0;',
            //openedSymbol: '&#8863; &#x1f5c1;',
            //collapseAll: 'Collapse all',
            //expandAll: 'Expand all',
            collapsed: false, 
        });
        lay.addTo(map);
		document.addEventListener("DOMContentLoaded", function() {
            // set new Layers List height which considers toggle icon
            function newLayersListHeight() {
                var layerScrollbarElement = document.querySelector('.leaflet-control-layers-scrollbar');
                if (layerScrollbarElement) {
                    var layersListElement = document.querySelector('.leaflet-control-layers-list');
                    var originalHeight = layersListElement.style.height 
                        || window.getComputedStyle(layersListElement).height;
                    var newHeight = parseFloat(originalHeight) - 50;
                    layersListElement.style.height = newHeight + 'px';
                }
            }
            var isLayersListExpanded = true;
            var controlLayersElement = document.querySelector('.leaflet-control-layers');
            var toggleLayerControl = document.querySelector('.leaflet-control-layers-toggle');
            // toggle Collapsed/Expanded and apply new Layers List height
            toggleLayerControl.addEventListener('click', function() {
                if (isLayersListExpanded) {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                } else {
                    controlLayersElement.classList.add('leaflet-control-layers-expanded');
                }
                isLayersListExpanded = !isLayersListExpanded;
                newLayersListHeight()
            });	
			// apply new Layers List height if toggle layerstree
			if (controlLayersElement) {
				controlLayersElement.addEventListener('click', function(event) {
					var toggleLayerHeaderPointer = event.target.closest('.leaflet-layerstree-header-pointer span');
					if (toggleLayerHeaderPointer) {
						newLayersListHeight();
					}
				});
			}
            // Collapsed/Expanded at Start to apply new height
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            setTimeout(function() {
                toggleLayerControl.click();
            }, 10);
            // Collapsed touch/small screen
            var isSmallScreen = window.innerWidth < 650;
            if (isSmallScreen) {
                setTimeout(function() {
                    controlLayersElement.classList.remove('leaflet-control-layers-expanded');
                    isLayersListExpanded = !isLayersListExpanded;
                }, 500);
            }  
        });       
        setBounds();
        var i = 0;
        layer_Assets_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((exp_label_Assets_1_eval_expression(context) !== null?String('<div style="color: #ffffff; font-size: 12pt; font-weight: bold; font-family: \'Open Sans\', sans-serif;">' + exp_label_Assets_1_eval_expression(context)).replace(/\\n/g, '<br>') + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_Assets_1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_Assets_1]);
        map.on("zoomend", function(){
            resetLabels([layer_Assets_1]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_Assets_1]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_Assets_1]);
        });
        </script>
		<!-- ===== Custom additions ===== -->
<style>
  /* Full-window map */
  body { margin: 0; }
  #map { width: 100vw !important; height: 100vh !important; }

  /* Logo in the top-left corner, zoom controls below it */
  #logo { position: absolute; top: 12px; left: 10px; z-index: 1000; height: 60px; }
  .leaflet-top.leaflet-left { top: 72px; }

  /* Hide qgis2web's layer list (replaced by the custom legend) */
  .leaflet-control-layers { display: none !important; }

  /* Bottom-left stack: summary, school picker, legend */
  #bottom-left { position: absolute; bottom: 20px; left: 10px; z-index: 1000;
    display: flex; flex-direction: column; gap: 8px; }
  .info-box { background: white; padding: 10px 12px; border-radius: 6px;
    box-shadow: 0 1px 5px #0004; font: 13px sans-serif; }
  .info-box h4 { margin: 0 0 6px; font-size: 14px; }
  .hint { color: #777; font-size: 11px; margin-top: 4px; }

  /* School dropdown */
  #school-select { width: 100%; font: 13px sans-serif; padding: 4px; }

  /* Clickable legend rows */
  .legend-row { display: flex; align-items: center; gap: 8px; margin: 3px 0;
    cursor: pointer; user-select: none; padding: 2px 4px; border-radius: 4px; }
  .legend-row:hover { background: #0000000d; }
  .legend-row.off { opacity: 0.35; }
  .legend-row.off .legend-label { text-decoration: line-through; }
  .legend-swatch { width: 18px; height: 14px; border: 1px solid #0003; }

  /* Always-on sq ft labels */
  .area-label { background: none; border: none; box-shadow: none;
    color: white; font-weight: bold; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .area-label::before { display: none; }
</style>

<img id="logo" src="logo.jpg" alt="Logo">
<div id="bottom-left">
  <div id="summary" class="info-box"></div>
  <div class="info-box">
    <h4>Select School</h4>
    <select id="school-select"></select>
  </div>
  <div id="legend" class="info-box"></div>
</div>

<script>
(function () {
  // Find qgis2web's variables even if the number suffix changes (Assets_1, Assets_2, ...)
  const find = prefix => Object.keys(window).find(k => new RegExp('^' + prefix + '_\\d+$').test(k));
  const data    = window[find('json_Assets')];
  const layer   = window[find('layer_Assets')];
  const styleFn = window[find('style_Assets_\\d+')];

  map.invalidateSize();
  map.attributionControl.addAttribution('Imagery: LA County / LARIAC (2014)');
  window.resetLabels = function () {};

  const sqft = p => Number(p.area_sqft) || 0;
  const fmt  = n => Math.round(n).toLocaleString();

  // Legend: [category value in data, label shown]
  const legendItems = [
    ['Functional',     'Functional Turf'],
    ['Non-Functional', 'Non-Functional Turf']
  ];
  const activeCats = new Set(legendItems.map(([v]) => v));
  let selectedSchool = '';   // '' = all schools

  const isVisible = p =>
    activeCats.has(p.category) && (!selectedSchool || p.site_name === selectedSchool);

  // Collect every drawn polygon (qgis2web may nest layers), labeling each feature once
  const shapes = [];
  const labeled = new Set();
  (function walk(group) {
    group.eachLayer(l => {
      if (l.feature) {
        shapes.push(l);
        if (!labeled.has(l.feature)) {
          labeled.add(l.feature);
          l.unbindTooltip();
          l.bindTooltip(fmt(sqft(l.feature.properties)) + ' sq ft',
            { permanent: true, direction: 'center', className: 'area-label' });
        }
      } else if (l.eachLayer) {
        walk(l);
      }
    });
  })(layer);

  function updateMap() {
    shapes.forEach(l => {
      const show = isVisible(l.feature.properties);
      const el = l.getElement && l.getElement();
      if (el) el.style.display = show ? '' : 'none';
      if (l.getTooltip()) show ? l.openTooltip() : l.closeTooltip();
      if (!show) l.closePopup();
    });
  }

  function updateSummary() {
    const feats = data.features.map(f => f.properties).filter(isVisible);
    const total = feats.reduce((s, p) => s + sqft(p), 0);
    const byCat = {};
    feats.forEach(p => byCat[p.category] = (byCat[p.category] || 0) + sqft(p));
    let html = `<h4>Summary${selectedSchool ? ': ' + selectedSchool : ''}</h4>` +
               `<b>${feats.length} areas · ${fmt(total)} sq ft total</b><br>`;
    for (const c in byCat) html += `${c}: ${fmt(byCat[c])} sq ft<br>`;
    if (!feats.length) html += '<i>Nothing selected</i>';
    document.getElementById('summary').innerHTML = html;
  }

  function zoomToVisible() {
    const bounds = L.latLngBounds([]);
    shapes.forEach(l => { if (isVisible(l.feature.properties)) bounds.extend(l.getBounds()); });
    if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 20 });
  }

  function refresh() { updateMap(); updateSummary(); }

  // School dropdown, built from site_name values
  const schools = [...new Set(data.features.map(f => f.properties.site_name).filter(Boolean))].sort();
  const select = document.getElementById('school-select');
  select.add(new Option('All schools', ''));
  schools.forEach(s => select.add(new Option(s, s)));
  select.addEventListener('change', () => {
    selectedSchool = select.value;
    refresh();
    zoomToVisible();
  });

  // Category legend
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '<h4>Legend</h4>';
  legendItems.forEach(([value, label]) => {
    const color = styleFn({ properties: { category: value } }).fillColor;
    const row = document.createElement('div');
    row.className = 'legend-row';
    row.innerHTML = `<span class="legend-swatch" style="background:${color}"></span>
                     <span class="legend-label">${label}</span>`;
    row.addEventListener('click', () => {
      activeCats.has(value) ? activeCats.delete(value) : activeCats.add(value);
      row.classList.toggle('off', !activeCats.has(value));
      refresh();
    });
    legendEl.appendChild(row);
  });
  legendEl.insertAdjacentHTML('beforeend', '<div class="hint">Click to show/hide</div>');

  refresh();
})();
</script>
<!-- ===== End custom additions ===== -->
    </body>
</html>
